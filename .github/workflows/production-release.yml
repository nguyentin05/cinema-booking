name: Production Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/flask-app

jobs:
  retag-and-push:
    name: Retag & Push Production Image
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Releasing version: $VERSION from sha: ${{ github.sha }}"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Retag tested image as production
        run: |
          docker pull ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          docker tag  ${{ env.IMAGE_NAME }}:sha-${{ github.sha }} \
                      ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}
          docker tag  ${{ env.IMAGE_NAME }}:sha-${{ github.sha }} \
                      ${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}
          docker push ${{ env.IMAGE_NAME }}:latest

  create-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [ retag-and-push ]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.retag-and-push.outputs.version }}
          generate_release_notes: true

  release-summary:
    name: Release Summary
    runs-on: ubuntu-latest
    needs: [ retag-and-push, create-github-release ]
    if: always()
    steps:
      - name: Generate Summary
        run: |
          echo "## Production Release ${{ needs.retag-and-push.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Retag & Push | ${{ needs.retag-and-push.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| GitHub Release | ${{ needs.create-github-release.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Image Tags Published" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | Note |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|------|" >> $GITHUB_STEP_SUMMARY
          echo "| \`latest\` | Production latest |" >> $GITHUB_STEP_SUMMARY
          echo "| \`${{ needs.retag-and-push.outputs.version }}\` | This release |" >> $GITHUB_STEP_SUMMARY
          echo "| \`sha-${{ github.sha }}\` | Original tested image |" >> $GITHUB_STEP_SUMMARY