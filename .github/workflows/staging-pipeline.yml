name: Staging CI/CD Pipeline

on:
  push:
    branches: [ "staging" ]
  pull_request:
    branches: [ "staging" ]
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/flask-app

jobs:
  integration-test:
    name: 1. Integration Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Pytest Integration
        run: |
          export PYTHONPATH=.
          pytest -q app/test/ --cov=app --cov-report=xml:coverage.xml --junitxml=test-results.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml
          retention-days: 1

  build-and-push:
    name: 2. Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [ integration-test ]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:staging
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  performance-test-ephemeral:
    name: 3. Ephemeral Performance Test
    runs-on: ubuntu-latest
    needs: [ build-and-push ]
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Locust
        run: pip install locust

      - name: Spin up Ephemeral Environment (Local Staging)
        run: |
          docker run -d --name cinema-app -p 5000:5000 -e FLASK_ENV=testing ${{ env.IMAGE_NAME }}:staging
          timeout 60 bash -c 'until curl -s http://localhost:5000/ || curl -s http://localhost:5000/api/movies; do sleep 2; done'

      - name: Run Locust Performance Test
        run: |
          locust --headless --users 50 --spawn-rate 5 --run-time 60s --host http://localhost:5000 --html performance-report.html --csv performance-results.csv -f performance-test/locustfile.py

      - name: Upload Performance Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-report
          path: |
            performance-report.html
            performance-results.csv
          retention-days: 7

      - name: Dump Container Logs on Failure
        if: failure()
        run: docker logs cinema-app

  pipeline-summary:
    name: 4. Staging Pipeline Summary
    runs-on: ubuntu-latest
    needs: [ integration-test, performance-test-ephemeral ]
    if: always()
    steps:
      - name: Generate Dashboard
        run: |
          echo "## Báo Cáo Quy Trình Staging" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Giai đoạn | Trạng thái |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|------------|" >> $GITHUB_STEP_SUMMARY
          echo "| 1. Integration Test | ${{ needs.integration-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 2. Cấp quyền Build Image | Bỏ qua (Chỉ chạy khi Push) |" >> $GITHUB_STEP_SUMMARY
          echo "| 3. Performance Test | ${{ needs.performance-test-ephemeral.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY