name: Staging CI/CD Pipeline

on:
  push:
    branches: [ "staging" ]
  pull_request:
    branches: [ "staging" ]
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/flask-app

jobs:
  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt -r requirements/prod.txt -r requirements/dev.txt

      - name: Run Pytest Integration
        run: |
          export PYTHONPATH=.
          pytest -q tests/integration --cov=app --cov-report=xml:coverage.xml --junitxml=test-results.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml
          retention-days: 1

  build-and-push:
    name: Build & Push Docker Hub
    runs-on: ubuntu-latest
    needs: [ integration-test ]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    outputs:
      image_tag: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/production/Dockerfile.prod
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:staging
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  performance-test:
    name: Performance Test
    runs-on: ubuntu-latest
    needs: [ build-and-push ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Locust
        run: pip install locust

      - name: Set up environment
        run: |
          docker compose -f docker/staging/compose.staging.yml up -d --wait
          docker compose -f docker/staging/compose.staging.yml exec app python init_db.py
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}

      - name: Run Locust Performance Test
        run: |
          locust --headless --users 50 --spawn-rate 5 --run-time 60s \
            --host http://localhost:5000 \
            --html performance-report.html \
            --csv performance-results.csv \
            -f tests/performance/locustfile.py

      - name: Dump Container Logs on Failure
        if: failure()
        run: docker compose -f docker/staging/compose.staging.yml logs

      - name: Upload Performance Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-report
          path: |
            performance-report.html
            performance-results.csv
          retention-days: 7

  pipeline-summary:
    name: Staging Pipeline Summary
    runs-on: ubuntu-latest
    needs: [ integration-test, build-and-push, performance-test ]
    if: always()
    steps:
      - name: Generate Summary
        run: |
          echo "## Staging Pipeline Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Test | ${{ needs.integration-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build & Push | ${{ needs.build-and-push.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Performance Test | ${{ needs.performance-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Image Tags" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | Purpose |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| \`staging\` | Latest staging build |" >> $GITHUB_STEP_SUMMARY
          echo "| \`sha-${{ github.sha }}\` | This specific commit |" >> $GITHUB_STEP_SUMMARY