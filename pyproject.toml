[tool.mutmut]
paths_to_mutate = ["app/daos", "app/services", "app/controllers"]
tests_dir = ["tests/"]
runner = "python -m pytest tests/unit/ --ignore=mutants"
also_copy = ["config.py", ".env.example"]
exclude_paths = [
    "app/migrations",
    "app/__pycache__"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "conftest.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]
norecursedirs = ["mutants", "venv", ".git", ".mutmut-cache", "__pycache__", "app/migrations"]