services:
  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    ports:
      - "${MYSQL_PORT}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    restart: always
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 600s

  redis:
    image: redis:8.4.2-alpine3.22
    container_name: redis
    restart: always
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    image: ${IMAGE_NAME}:${IMAGE_TAG:-staging}
    container_name: web_app
    command: sh -c "python init_db.py && gunicorn --bind 0.0.0.0:5000 run:app"
    ports:
      - "5000:5000"
    restart: always
    env_file:
      - ../../.env
    environment:
      - APP_ENV=staging
      - FLASK_HOST=0.0.0.0
      - SQLALCHEMY_DATABASE_URI=mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@localhost:3306/${MYSQL_DATABASE}
      - REDIS_HOST=localhost

volumes:
  mysql_data: